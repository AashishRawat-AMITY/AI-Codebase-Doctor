
spring.application.name=codebase-doctor

# Database configuration: supplied through environment variables
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Hibernate / JPA configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Repository storage
codebase.storage.path=${CODEBASE_STORAGE_PATH:C:/codebase-doctor/repositories}

# AI service URL
ai.service.url=${AI_SERVICE_URL:http://127.0.0.1:8000}
